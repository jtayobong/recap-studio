[package]
name = "recap-studio"
version = "0.5.1"
description = "Recap Studio desktop app: the web app in a native window (WebView2)"
edition = "2024"
rust-version = "1.90"

[lib]
name = "recap_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }

[profile.release]
# Smaller installer: the Rust side is a thin shell around the web app.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
